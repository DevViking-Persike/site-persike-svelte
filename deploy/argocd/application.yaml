apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: meu-site
  namespace: argocd
spec:
  project: meu-site
  source:
    repoURL: https://github.com/DevViking-Persike/site-persike-svelte.git
    targetRevision: gitops
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: site-persike
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=false
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
